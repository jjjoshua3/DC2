# Admin-wijzigingen die iedereen ziet: zet in Netlify bij
# Environment variables de sleutel DATABASE_URL op je
# Supabase Postgres-adres. Zonder die sleutel blijft de site
# online met de teksten die nu in de pagina zitten.
# Inloglinks: zet ook GMAIL_APP_PASSWORD (app-wachtwoord van aa0271n8@gmail.com).
[build]
  command = "npm run build && cp node_modules/@electric-sql/pglite/dist/pglite.data .netlify/functions-internal/server/_libs/pglite.data"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
